<!DOCTYPE html>
<html lang="en">
<head>
    <title>unordered list</title>
</head>
<body>
    <h4>Disc bullets list</h4>
    <ul type="disc">
    <li>Jones</li>
    <li>Adams</li>
    <li>scott</li>
    <h4>Circle bullets list</h4>
    <ul type="circle">
    <li>jones</li>
    <li>Adams</li>
    <li>scott</li>
    <ul type="square">
    <li>jones</li>
    <li>Adams</li>
    <li>scott</li>
        
    
</body>
</html>
